name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below to help us reproduce and fix the issue.

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: When I open X provider in desktop mode, Y happens...
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: Steps to Reproduce
      description: Detailed steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '....'
        3. Scroll down to '....'
        4. See error
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: A clear and concise description of what you expected to happen.
    validations:
      required: true

  - type: input
    id: device
    attributes:
      label: Device
      placeholder: e.g., Pixel 8, Samsung Galaxy S24
    validations:
      required: false

  - type: input
    id: android-version
    attributes:
      label: Android Version
      placeholder: e.g., Android 14, API 34
    validations:
      required: false

  - type: input
    id: app-version
    attributes:
      label: App Version
      placeholder: e.g., 2.0.0
    validations:
      required: false

  - type: dropdown
    id: module
    attributes:
      label: Module
      description: Which module is affected?
      options:
        - Kotlin/Compose app (app)
        - Java app (appJava)
        - Both
        - Build system / CI
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs / Screenshots
      description: If applicable, add logcat output or screenshots to help explain the problem.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional Context
      description: Add any other context about the problem here.
    validations:
      required: false
