name: Android Java CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-java-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Java 21 test and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
          cache: gradle

      - name: Verify Java toolchain
        run: |
          java -version
          ./gradlew --version

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Unit tests
        run: ./gradlew --no-daemon --stacktrace :appJava:testDebugUnitTest

      - name: Lint
        run: ./gradlew --no-daemon --stacktrace :appJava:lintDebug

      - name: Debug APK
        run: ./gradlew --no-daemon --stacktrace :appJava:assembleDebug

      - name: Release APK
        run: ./gradlew --no-daemon --stacktrace :appJava:assembleRelease

      - name: Release AAB
        run: ./gradlew --no-daemon --stacktrace :appJava:bundleRelease

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: multai-java-debug-apk
          path: appJava/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: multai-java-release-apk
          path: appJava/build/outputs/apk/release/*.apk
          if-no-files-found: error

      - name: Upload release AAB
        uses: actions/upload-artifact@v4
        with:
          name: multai-java-release-aab
          path: appJava/build/outputs/bundle/release/*.aab
          if-no-files-found: error
